<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>下载 知识蒸馏工作台</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F4EE;color:#2b2622;
       font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .box{max-width:520px;padding:40px 36px;background:#fff;border:1px solid #e6e0d6;border-radius:16px;
       box-shadow:0 18px 44px -22px rgba(60,45,30,.28);text-align:center}
  h1{font-size:19px;margin:0 0 8px;font-weight:600}
  .v{font-size:12px;color:#9a8f80;margin-bottom:22px}
  a.dl{display:inline-block;padding:13px 30px;border-radius:10px;background:#8B3A3A;color:#fff;
       text-decoration:none;font-size:15px;font-weight:600}
  a.dl:hover{background:#7a3232}
  .tip{margin-top:22px;font-size:13px;line-height:1.9;color:#6b6157;text-align:left}
  .tip b{color:#8B3A3A}
  .warn{margin-top:14px;padding:11px 14px;border-radius:9px;background:#fff4e2;border:1px solid #f0d3a8;
        font-size:12.5px;line-height:1.8;color:#7a3b00;text-align:left}
</style></head>
<body>
<div class="box">
  <h1>知识蒸馏工作台</h1>
  <div class="v" id="ver"></div>
  <a class="dl" id="dl" href="#" download>⬇ 下载到本地</a>
  <div class="tip">
    <b>下载完，去「下载」文件夹找到这个文件，双击打开。</b><br>
    你的书、原文、知识包、激活码都还在 —— 换文件不影响，它们是按这台电脑存的。
  </div>
  <div class="warn">
    <b>不要直接在这个网页上用。</b>网页上打开的东西，关掉标签页就什么都没了，
    而且和你在本地文件里存的数据<b>不是同一份</b>。
  </div>
</div>
<script>
  var f = new URLSearchParams(location.search).get('f') || '知识蒸馏工作台_v6.1.4.html';
  var a = document.getElementById('dl');
  a.href = f; a.download = f;
  document.getElementById('ver').textContent = f.replace(/\.html$/, '').replace(/^知识蒸馏工作台_?/, '');
  // 自动开始下载（同源 + download 属性 → 浏览器下载而不是渲染）
  addEventListener('load', function () { setTimeout(function () { a.click(); }, 350); });
</script>
</body></html>
